<style>
:root{--bg:#f6f7fb;--txt:#1f2937;--mut:#6b7280;--line:#e5e7eb;--navy:#1d2a44;--mag:#ed168c;--mag2:#c90d73;--soft:#fff5fb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,"Noto Sans Hebrew",sans-serif;color:var(--txt)}.wrap{max-width:1100px;margin:auto;padding:0 20px 46px}

.track{height:8px;background:#e6e8ee;border-radius:999px;position:relative;margin:0 31px}.fill{position:absolute;right:0;height:100%;background:var(--mag);border-radius:999px;transition:.25s}

.gallery{display:grid;gap:14px;margin:20px 0 26px}.screen{background:#fafbfc;border:1px solid var(--line);border-radius:16px;overflow:hidden;text-align:center}.screen img{display:block;max-width:100%;max-height:640px;margin:auto;object-fit:contain;background:#fff}.cap{font-size:11px;color:var(--mut);padding:8px 12px;border-top:1px solid var(--line)}

.actions{display:flex;gap:12px;justify-content:space-between;margin-top:30px}button{border-radius:12px;padding:14px 20px;font-size:15px;cursor:pointer;transition:transform .16s ease,box-shadow .16s ease,background .16s ease,border-color .16s ease}.back{background:white;border:1px solid var(--line);color:var(--txt)}.back:hover{background:#f3f4f6;border-color:#cfd4dc;transform:translateY(-2px);box-shadow:0 5px 14px #1f293712}.next{background:var(--navy);border:1px solid var(--navy);color:white;margin-right:auto;font-weight:700}.next:hover{background:#111d34;border-color:#111d34;transform:translateY(-2px);box-shadow:0 7px 18px #1d2a4430}button:active{transform:translateY(0)}

.done{text-align:center;padding:15px 10px 8px}.done h1{direction:rtl;text-align:center;margin:8px 0 10px}.party{height:180px;position:relative;display:grid;place-items:center;overflow:hidden}.party img{width:150px;max-height:140px;object-fit:contain;animation:partyPop .7s cubic-bezier(.2,.8,.2,1) both,partyFloat 2.2s ease-in-out .7s infinite alternate}@keyframes partyPop{0%{transform:scale(.25) rotate(-14deg);opacity:0}75%{transform:scale(1.12) rotate(4deg)}100%{transform:scale(1) rotate(0);opacity:1}}@keyframes partyFloat{to{transform:translateY(-8px) rotate(3deg)}}
.confetti{position:absolute;width:9px;height:15px;border-radius:3px;animation:fall 1.8s ease-in infinite;top:-20px}@keyframes fall{to{transform:translateY(210px) rotate(360deg);opacity:.1}}
.todo{text-align:right;max-width:720px;margin:24px auto 0;background:#f8fafc;border:1px solid var(--line);border-radius:16px;padding:18px 20px;line-height:1.65}.todo b{color:var(--navy)}.security{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}.source{font-size:11px;color:var(--mut);margin-top:18px}

<script>
const S=[{"title": "Open Account", "imgs": ["https://www.bankeronwheels.com/wp-content/uploads/2024/09/Screenshot-2024-09-30-201847.png"], "items": [["Open Account", "באתר של IBKR לחצי על הכפתור האדום Open Account בפינה הימנית העליונה."], ]}, {"title": "Create a Username and Password", "imgs": ["https://www.bankeronwheels.com/wp-content/uploads/2024/08/User1.png"], "items": [["Email Address", "הזיני את כתובת המייל שלך."], ["Username", "צרי שם משתמש ושמרי אותו במנהל הסיסמאות שלך."], ["Password / Confirm Password", "צרי סיסמה חזקה והזיני אותה שוב."], ["Country", "בחרי Israel. הכוונה למדינת המגורים העיקרית שלך, לא לאזרחות."], ["Create Account", "לחצי Create Account."]]}, {"title": "Email Verification", "imgs": ["https://www.bankeronwheels.com/wp-content/uploads/2024/08/tre-e1727351847873-1536x276.png"], "items": [["Verify Email", "פתחי את המייל מ־IBKR ולחצי על קישור האימות."], ["Return to Application", "חזרי ל־IBKR והמשיכי את הבקשה."]]}, {"title": "Select The Desired Account", "imgs": ["https://www.bankeronwheels.com/wp-content/uploads/2024/08/quattro.png", "https://www.bankeronwheels.com/wp-content/uploads/2024/08/Cinque-1536x446.png", "https://www.bankeronwheels.com/wp-content/uploads/2024/08/sei-1536x1516.png"], "items": [["Account Type", "למדריך הזה בחרי Individual , חשבון אישי על שמך."], ["Start Application", "לחצי Start Application."]], "note": ["חשבון אישי", "המדריך הזה בנוי לפתיחת Individual Account. אם את פותחת Joint או סוג חשבון אחר, המסלול משתנה."]}, {"title": "Personal Information", "imgs": ["https://www.bankeronwheels.com/wp-content/uploads/2024/08/sette-768x1331.png", "https://www.bankeronwheels.com/wp-content/uploads/2024/08/otto-1174x1536.png"], "items": [["Contact Information", "מלאי שם, כתובת וטלפון בדיוק לפי הפרטים שלך."], ["Address Line One", "רחוב ומספר בית באנגלית."], ["Address Line Two", "דירה / קומה, אם רלוונטי."], ["City / Zip", "עיר ומיקוד."], ["Date of Birth", "תאריך לידה."], ["Marital Status", "מצב משפחתי."], ["Number of Dependents", "מספר האנשים התלויים בך כלכלית, לפי מצבך."], ["Tax Residency", "אם את תושבת מס בישראל בלבד, בחרי Israel."], ["Tax Identification Number", "לתושבת ישראל יחידה: מספר תעודת הזהות שלך, 9 ספרות."], ["Identification", "בחרי Israel כמדינת ההנפקה, את סוג המסמך שאת מציגה, והזיני את מספר המסמך בדיוק כפי שמופיע עליו."]], "note": ["מה זה Tax Identification Number?", "זה מספר הזיהוי שלך לצורכי מס. בישראל, אצל יחיד, זה מספר תעודת הזהות. אם את תושבת מס גם במדינה נוספת, הוסיפי אותה לפי המצב שלך."]}, {"title": "Employment & Source of Wealth", "imgs": ["https://www.bankeronwheels.com/wp-content/uploads/2024/08/nove-1124x1536.png", "https://www.bankeronwheels.com/wp-content/uploads/2024/08/dieci-1536x1037.png"], "items": [["Employment Status", "בחרי את מה שמתאר אותך: Employed = שכירה · Self-Employed = עצמאית · Student = סטודנטית · Homemaker = עקרת בית · Unemployed = לא מועסקת · Retired = פנסיונרית · At Home Trader = סוחרת מהבית."], ["My Employment", "אם בחרת Employed / Self-Employed, מלאי שם מעסיק/עסק, כתובת, Nature of Business = תחום הפעילות, ו־Occupation = התפקיד שלך."], ["Financial Firm", "אם את או בן/בת משפחה קרובה עובדים או רשומים בגוף פיננסי מהסוג שמפורט בשאלה , Yes. אחרת , No."], ["Source of Wealth", "סמני מאיפה נבנה ההון שלך בפועל , למשל הכנסה מעבודה, חסכונות, השקעות, ירושה, נדל״ן או מקור אחר שמופיע אצלך."], ["Source Used to Fund Account", "סמני מאיזה מהמקורות האלה מגיע הכסף שאת מתכוונת להעביר לחשבון."]], "note": ["למה שואלים מאיפה הכסף?", "זו בדיקה רגולטורית של מקור ההון והכספים. אין תשובה ש'עדיף' לבחור , המטרה היא שהתשובות יתארו את המצב שלך בפועל ושיהיה אפשר לתמוך בהן במסמכים אם IBKR יבקשו."]}, {"title": "Base Currency, Security Questions & Phone", "imgs": ["https://www.bankeronwheels.com/wp-content/uploads/2024/08/unidci-768x1151.png", "https://www.bankeronwheels.com/wp-content/uploads/2024/08/dodici-1536x466.png"], "items": [["Base Currency", "למסלול שלנו בחרי United States Dollar (USD). זה מטבע הדיווח של החשבון; הוא לא מגביל אותך להחזיק או לסחור רק בדולרים."], ["Security Questions", "בחרי 3 שאלות שתזכרי את התשובות אליהן גם בעתיד. שמרי גם אותן במנהל הסיסמאות."], ["Mobile Number", "הזיני את מספר הנייד שלך ואמתִי אותו אם מופיעה בקשת אימות."]]}, {"title": "Configure Your Trading Account", "imgs": ["https://www.bankeronwheels.com/wp-content/uploads/2024/09/ss13.webp", "https://www.bankeronwheels.com/wp-content/uploads/2024/08/Quindici-1536x910.png"], "items": [["Account Type", "בחרי Cash. זה החשבון הפשוט ללא הלוואה מהברוקר וללא מינוף."], ["Annual Net Income (USD)", "בחרי את הטווח שהכי קרוב להכנסה השנתית נטו שלך. IBKR מציגים טווחים , לא צריך לחשב עד הדולר."], ["Net Worth (USD)", "בחרי את הטווח שהכי קרוב לשווי הכולל שלך: מה שיש לך בנכסים ובחסכונות, פחות מה שאת חייבת בחובות והלוואות."], ["Liquid Net Worth (USD)", "בחרי את הטווח שהכי קרוב לכסף ולנכסים שאפשר להפוך למזומן יחסית מהר , למשל כסף בבנק והשקעות סחירות. דירת מגורים בדרך כלל אינה נחשבת נזילה."], ["Investment Objectives", "אם המטרה שלך היא צמיחת הון לאורך זמן, Growth מתארת את המטרה הזו. סמני אפשרויות נוספות רק אם הן באמת חלק מהמטרות שלך."], ["Experience / Trades / Knowledge", "בכל מוצר שמופיע, בחרי את שנות הניסיון, מספר העסקאות בשנה ורמת הידע שמתארים אותך בפועל."], ["Trading Permissions , Stocks", "כדי לקנות מניות או ETF צריך Stocks. הוסיפי את השווקים שבהם את מתכננת לסחור. אל תוסיפי Options, Futures, CFDs וכד׳ אם אינך מתכוונת להשתמש בהם."]], "note": ["חשוב", "זו הכוונה טכנית לפתיחת החשבון, לא המלצה השקעתית. אל תגדילי ניסיון, ידע או מטרות כדי לקבל הרשאה. קראי את האפשרויות ובחרי רק מה שמתאר אותך בפועל."]}, {"title": "Regulatory Questions", "imgs": ["https://www.bankeronwheels.com/wp-content/uploads/2024/08/sedici-1-1536x1351.png"], "items": [["Financial Industry", "אם השאלה שואלת האם את או קרוב משפחה מיידי עובדים/רשומים בגוף פיננסי , Yes רק אם זה נכון. אחרת No."], ["Public Company / Control Person", "אם השאלה שואלת האם את מנהלת, דירקטורית, בעלת שליטה או קשורה באופן שמפורט לחברה ציבורית , עני לפי מצבך. אם לא, No."], ["Other Regulatory Questions", "קראי כל שאלה ועני אמת. אם מופיעה אצלך שאלה שהניס function intro(){head.style.display="none";main.innerHTML=`<div class="intro"><div class="kicker">ההשקעה הראשונה שלי · שבוע 1</div><h1>פותחות חשבון השקעות ב־IBKR</h1><p>פתחי את IBKR בטאב נוסף. מכאן עובדות מסך־מסך: מסתכלת כאן, מבצעת שם, וחוזרת לצעד הבא.</p>${disc}<p><b>זמן משוער:</b> שרייני כ-45 דקות. יכול להיות שתסיימי קודם, אבל עדיף להגיע עם הכל מוכן ולעשות את התהליך ברצף.</p>
<p><b>הכיני מראש:</b></p>
<div class="todo" style="margin:10px 0 20px;max-width:none">
<b>1. מסמך זיהוי מוכן להעלאה</b><br>
צילום או קובץ דיגיטלי ברור של מסמך מזהה בתוקף. הכי פשוט להכין מראש דרכון או תעודת זהות. ודאי שכל המסמך מופיע בתמונה ושהטקסט קריא.<br><br>

<b>2. מספר תעודת הזהות שלך</b><br>
9 ספרות. הוא משמש גם כ-Tax Identification Number לתושבת מס ישראלית יחידה.<br><br>

<b>3. הכתובת שלך באנגלית</b><br>
רחוב, מספר בית, דירה אם יש, עיר ומיקוד. כתבי אותה בדיוק באותו אופן לאורך התהליך.<br><br>

<b>4. פרטי עבודה</b><br>
שם המעסיק או העסק באנגלית, כתובת, תחום הפעילות והתפקיד שלך.<br><br>

<b>5. הערכה כללית של הכנסה והון</b><br>
לא צריך להכין מסמך. רק לחשוב מראש על שלושה מספרים בקירוב: כמה את מרוויחה נטו בשנה, כמה שווה כל מה שיש לך אחרי שמפחיתים את החובות שלך, וכמה מתוך הכסף הזה זמין יחסית מהר, למשל כסף בעו״ש, בפיקדונות או בהשקעות סחירות. במסך עצמו IBKR יציגו טווחים, ואת רק תבחרי את הטווח שהכי קרוב למצב שלך.<br><br>

<b>6. מסמך נפרד שמוכיח כתובת</b><br>
הכיני מראש PDF או צילום ברור של מסמך שבו מופיעים גם השם המלא שלך וגם כתובת המגורים שהזנת ב-IBKR. הכי פשוט להכין אחד מאלה: חשבון חשמל, מים, טלפון או גז מהשנה האחרונה, או תדפיס/דוח מהבנק מהשנה האחרונה שבו מופיעים השם והכתובת. אפשר להשתמש גם בחוזה שכירות בתוקף או במסמכי בעלות על נכס.<br><br>

<b>אל תבני על ספח תעודת הזהות כהוכחת כתובת.</b> IBKR מציינים תעודת זהות כמסמך שמוכיח זהות, אבל ברשימת המסמכים להוכחת כתובת הם דורשים מסמך שמציג בבירור את השם ואת הכתובת. לכן הכיני מראש מסמך נפרד מהרשימה למעלה, כדי שלא תיתקעי בשלב האימות.
