<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ההשקעה הראשונה שלי · IBKR</title>
<style>
:root{--bg:#f6f7fb;--txt:#1f2937;--mut:#6b7280;--line:#e5e7eb;--navy:#1d2a44;--mag:#ed168c;--mag2:#c90d73;--soft:#fff5fb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,"Noto Sans Hebrew",sans-serif;color:var(--txt)}.wrap{max-width:1100px;margin:auto;padding:0 20px 46px}
header{position:sticky;top:0;z-index:9;background:#f6f7fbf2;padding:16px 0 14px;backdrop-filter:blur(8px)}.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;margin-bottom:10px;padding:0 2px}.meta span:last-child{padding-left:12px}
.track{height:8px;background:#e6e8ee;border-radius:999px;position:relative;margin:0 31px}.fill{position:absolute;right:0;height:100%;background:var(--mag);border-radius:999px;transition:.25s}
.user{position:absolute;top:50%;transform:translate(50%,-50%);width:30px;height:30px;display:grid;place-items:center;transition:.25s}.user svg{width:24px;height:24px;fill:var(--mag)}
.goal{position:absolute;left:-22px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;background:white;border:2px solid var(--mag);display:grid;place-items:center;box-shadow:0 0 0 5px var(--bg)}.goal svg{width:19px;height:19px;fill:var(--mag)}
main{background:#fff;border:1px solid var(--line);border-radius:22px;padding:34px;margin-top:18px;box-shadow:0 5px 22px #1f293708}.kicker{font-size:13px;color:var(--mut);margin-bottom:7px}
h1{direction:ltr;text-align:left;color:var(--navy);font-size:30px;margin:0 0 22px}.disclaimer{background:var(--soft);border:1px solid #ffd0e8;border-radius:14px;padding:14px 16px;font-size:13px;line-height:1.55;margin:0 0 22px}
.gallery{display:grid;gap:14px;margin:20px 0 26px}.screen{background:#fafbfc;border:1px solid var(--line);border-radius:16px;overflow:hidden;text-align:center}.screen img{display:block;max-width:100%;max-height:640px;margin:auto;object-fit:contain;background:#fff}.cap{font-size:11px;color:var(--mut);padding:8px 12px;border-top:1px solid var(--line)}
.row{padding:14px 0;border-bottom:1px solid #eef0f4}.field{direction:ltr;text-align:left;font-weight:700}.answer{margin-top:6px;line-height:1.55}.note{margin-top:20px;border:1px solid #d9dee7;background:#f8fafc;border-radius:14px;padding:17px 19px;line-height:1.55}.note strong{display:block;color:var(--navy);margin-bottom:6px}
.actions{display:flex;gap:12px;justify-content:space-between;margin-top:30px}button{border-radius:12px;padding:14px 20px;font-size:15px;cursor:pointer;transition:transform .16s ease,box-shadow .16s ease,background .16s ease,border-color .16s ease}.back{background:white;border:1px solid var(--line);color:var(--txt)}.back:hover{background:#f3f4f6;border-color:#cfd4dc;transform:translateY(-2px);box-shadow:0 5px 14px #1f293712}.next{background:var(--navy);border:1px solid var(--navy);color:white;margin-right:auto;font-weight:700}.next:hover{background:#111d34;border-color:#111d34;transform:translateY(-2px);box-shadow:0 7px 18px #1d2a4430}button:active{transform:translateY(0)}
.intro{max-width:760px;margin:auto;padding:12px 0 5px}.intro h1{direction:rtl;text-align:right;font-size:34px}.intro p{font-size:17px;line-height:1.65}.start{background:var(--navy);color:#fff;border:1px solid var(--navy);font-weight:700}.start:hover{background:#111d34;transform:translateY(-2px);box-shadow:0 7px 18px #1d2a4430}
.done{text-align:center;padding:15px 10px 8px}.done h1{direction:rtl;text-align:center;margin:8px 0 10px}.party{height:180px;position:relative;display:grid;place-items:center;overflow:hidden}.party-icon{font-size:92px;line-height:1;position:relative;z-index:2}
.confetti{position:absolute;width:9px;height:15px;border-radius:3px;animation:fall 1.8s ease-in infinite;top:-20px}@keyframes fall{to{transform:translateY(210px) rotate(360deg);opacity:.1}}
.todo{text-align:right;max-width:720px;margin:24px auto 0;background:#f8fafc;border:1px solid var(--line);border-radius:16px;padding:18px 20px;line-height:1.65}.todo b{color:var(--navy)}.security{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}.source{font-size:11px;color:var(--mut);margin-top:18px}
@media(max-width:680px){.wrap{padding:0 13px 28px}main{padding:21px 16px;border-radius:18px}h1{font-size:24px}.intro h1{font-size:29px}.screen img{max-height:520px}.actions{position:sticky;bottom:0;background:white;padding:12px 0 2px;z-index:4}}
</style>

<script>
const S=[{"title": "Open Account", "imgs": ["https://www.bankeronwheels.com/wp-content/uploads/2024/09/Screenshot-2024-09-30-201847.png"], "items": [["Open Account", "באתר של IBKR לחצי על הכפתור האדום Open Account בפינה הימנית העליונה."], ]}, {"title": "Create a Username and Password", "imgs": ["https://www.bankeronwheels.com/wp-content/uploads/2024/08/User1.png"], "items": [["Email Address", "הזיני את כתובת המייל שלך."], ["Username", "צרי שם משתמש ושמרי אותו במנהל הסיסמאות שלך."], ["Password / Confirm Password", "צרי סיסמה חזקה והזיני אותה שוב."], ["Country", "בחרי Israel. הכוונה למדינת המגורים העיקרית שלך, לא לאזרחות."], ["Create Account", "לחצי Create Account."]]}, {"title": "Email Verification", "imgs": ["https://www.bankeronwheels.com/wp-content/uploads/2024/08/tre-e1727351847873-1536x276.png"], "items": [["Verify Email", "פתחי את המייל מ-IBKR ולחצי על קישור האימות."], ["Return to Application", "חזרי ל-IBKR והמשיכי את הבקשה."]]}, {"title": "Select The Desired Account", "imgs": ["https://www.bankeronwheels.com/wp-content/uploads/2024/08/quattro.png", "https://www.bankeronwheels.com/wp-content/uploads/2024/08/Cinque-1536x446.png", "https://www.bankeronwheels.com/wp-content/uploads/2024/08/sei-1536x1516.png"], "items": [["Account Type", "למדריך הזה בחרי Individual , חשבון אישי על שמך."], ["Start Application", "לחצי Start Application."]], "note": ["חשבון אישי", "המדריך הזה בנוי לפתיחת Individual Account. אם את פותחת Joint או סוג חשבון אחר, המסלול משתנה."]}, {"title": "Personal Information", "imgs": ["https://www.bankeronwheels.com/wp-content/uploads/2024/08/sette-768x1331.png", "https://www.bankeronwheels.com/wp-content/uploads/2024/08/otto-1174x1536.png"], "items": [["Contact Information", "מלאי שם, כתובת וטלפון בדיוק לפי הפרטים שלך."], ["Address Line One", "רחוב ומספר בית באנגלית."], ["Address Line Two", "דירה / קומה, אם רלוונטי."], ["City / Zip", "עיר ומיקוד. אם IBKR מציגים הודעה שהכתובת לא מזוהה, קראי את האפשרויות שמופיעות במסך ובדקי קודם שאין טעות בכתובת. אם מוצגת אפשרות להמשיך עם הכתובת שהזנת והיא אכן נכונה, אפשר לבחור בה."], ["Date of Birth", "תאריך לידה."], ["Marital Status", "מצב משפחתי."], ["Number of Dependents", "מספר האנשים שתלויים בך כלכלית. ברוב המקרים אלה ילדים שאת מפרנסת. אם יש אדם אחר שתלוי בך כלכלית באופן קבוע, למשל אדם שאת אפוטרופוסית שלו, התייחסי גם אליו לפי מצבך."], ["Tax Residency", "אם את תושבת מס בישראל בלבד, בחרי Israel."], ["Tax Identification Number", "אם המערכת מבקשת ממך TIN ואת תושבת מס ישראלית יחידה, הזיני את מספר תעודת הזהות הישראלי שלך, 9 ספרות. אל תסמני שאין לך TIN רק כדי להתקדם."], ["Identification", "בחרי Israel כמדינת ההנפקה, את סוג המסמך שאת מציגה, והזיני את מספר המסמך בדיוק כפי שמופיע עליו."]], "note": ["מה זה Tax Identification Number?", "זה מספר הזיהוי שלך לצורכי מס. בישראל, אצל יחיד, זה מספר תעודת הזהות. אם את תושבת מס גם במדינה נוספת, הוסיפי אותה לפי המצב שלך."]}, {"title": "Employment & Source of Wealth", "imgs": ["https://www.bankeronwheels.com/wp-content/uploads/2024/08/nove-1124x1536.png", "https://www.bankeronwheels.com/wp-content/uploads/2024/08/dieci-1536x1037.png"], "items": [["Employment Status", "בחרי את מה שמתאר אותך: Employed = שכירה · Self-Employed = עצמאית · Student = סטודנטית · Homemaker = עקרת בית · Unemployed = לא מועסקת · Retired = פנסיונרית · At Home Trader = סוחרת מהבית."], ["My Employment", "אם בחרת Employed / Self-Employed, מלאי שם מעסיק/עסק, כתובת, Nature of Business = תחום הפעילות, ו-Occupation = התפקיד שלך."], ["Financial Firm", "אם את או בן/בת משפחה קרובה עובדים או רשומים בגוף פיננסי מהסוג שמפורט בשאלה , Yes. אחרת , No."], ["Source of Wealth", "סמני מאיפה נבנה ההון שלך בפועל , למשל הכנסה מעבודה, חסכונות, השקעות, ירושה, נדל״ן או מקור אחר שמופיע אצלך."], ["Source Used to Fund Account", "סמני מאיזה מהמקורות האלה מגיע הכסף שאת מתכוונת להעביר לחשבון."]], "note": ["למה שואלים מאיפה הכסף?", "זו בדיקה רגולטורית של מקור ההון והכספים. אין תשובה ש'עדיף' לבחור , המטרה היא שהתשובות יתארו את המצב שלך בפועל ושיהיה אפשר לתמוך בהן במסמכים אם IBKR יבקשו."]}, {"title": "Base Currency, Security Questions & Phone", "imgs": ["https://www.bankeronwheels.com/wp-content/uploads/2024/08/unidci-768x1151.png", "https://www.bankeronwheels.com/wp-content/uploads/2024/08/dodici-1536x466.png"], "items": [["Base Currency", "למסלול שלנו בחרי United States Dollar (USD). זה מטבע הדיווח של החשבון; הוא לא מגביל אותך להחזיק או לסחור רק בדולרים."], ["Security Questions", "בחרי 3 שאלות שתזכרי את התשובות אליהן גם בעתיד. שמרי גם אותן במנהל הסיסמאות."], ["Mobile Number", "הזיני את מספר הנייד שלך ואמתִי אותו אם מופיעה בקשת אימות."]]}, {"title": "Configure Your Trading Account", "imgs": ["https://www.bankeronwheels.com/wp-content/uploads/2024/09/ss13.webp", "https://www.bankeronwheels.com/wp-content/uploads/2024/08/Quindici-1536x910.png"], "items": [["Account Type", "בחרי Cash. זה החשבון הפשוט ללא הלוואה מהברוקר וללא מינוף."], ["Annual Net Income (USD)", "בחרי את הטווח שהכי קרוב להכנסה השנתית נטו שלך. IBKR מציגים טווחים , לא צריך לחשב עד הדולר."], ["Net Worth (USD)", "בחרי את הטווח שהכי קרוב לשווי הכולל שלך: מה שיש לך בנכסים ובחסכונות, פחות מה שאת חייבת בחובות והלוואות."], ["Liquid Net Worth (USD)", "בחרי את הטווח שהכי קרוב לכסף ולנכסים שאפשר להפוך למזומן יחסית מהר , למשל כסף בבנק והשקעות סחירות. דירת מגורים בדרך כלל אינה נחשבת נזילה."], ["Investment Objectives", "אם המטרה שלך היא צמיחת הון לאורך זמן, Growth מתארת את המטרה הזו. סמני אפשרויות נוספות רק אם הן באמת חלק מהמטרות שלך."], ["Experience / Trades / Knowledge", "בכל מוצר שמופיע, בחרי את שנות הניסיון, מספר העסקאות בשנה ורמת הידע שמתארים אותך בפועל. אם המערכת מגבילה הרשאה בעקבות התשובות, אל תשני ניסיון או ידע רק כדי לפתוח את ההרשאה."], ["Trading Permissions , Stocks", "כדי לקנות מניות או ETF צריך Stocks. הוסיפי רק את השווקים שבהם את מתכננת לסחור. אם בהמשך תרצי לקנות ETF שנסחר בארה״ב, תצטרכי הרשאת Stocks לשוק האמריקאי. אין צורך להוסיף Options, Futures או CFDs אם אינך מתכוונת להשתמש בהם. אפשר לשנות הרשאות גם בהמשך."]], "note": ["חשוב", "זו הכוונה טכנית לפתיחת החשבון, לא ייעוץ השקעות. אל תגדילי ניסיון, ידע או מטרות כדי לקבל הרשאה. קראי את האפשרויות ובחרי רק מה שמתאר אותך בפועל."]}, {"title": "Regulatory Questions", "imgs": ["https://www.bankeronwheels.com/wp-content/uploads/2024/08/sedici-1-1536x1351.png"], "items": [["Financial Industry", "אם השאלה שואלת האם את או קרוב משפחה מיידי עובדים/רשומים בגוף פיננסי , Yes רק אם זה נכון. אחרת No."], ["Public Company / Control Person", "אם השאלה שואלת האם את מנהלת, דירקטורית, בעלת שליטה או קשורה באופן שמפורט לחברה ציבורית , עני לפי מצבך. אם לא, No."], ["Other Regulatory Questions", "קראי כל שאלה ועני אמת. אם מופיעה אצלך שאלה שהניסוח שלה לא ברור ולא מופיעה כאן , אל תנחשי. צלמי אותה."]], "note": ["אין כאן 'סט תשובות' שצריך לעבור", "השאלות משתנות לפי הפרטים שמילאת קודם. לכן אי אפשר לסמן No אוטומטית לכולן. המדריך נותן פירוש; התשובה היא תמיד לפי המצב שלך."]}, {"title": "Stock Yield Enhancement Program", "imgs": ["https://www.bankeronwheels.com/wp-content/uploads/2024/08/Account-type.gif"], "items": [["Stock Yield Enhancement Program", "זה מסלול אופציונלי. אם מצטרפים, IBKR יכולים להשאיל ניירות ערך מתאימים מהחשבון לצדדים אחרים. בתמורה אפשר לקבל חלק מההכנסה מההשאלה. בזמן ההשאלה קיימים תנאים וסיכונים נוספים שמפורטים במסמכי התוכנית."], ["Enroll / Decline", "התוכנית אינה נדרשת כדי לפתוח את החשבון. אם אינך רוצה לקבל עכשיו החלטה לגבי השאלת ניירות הערך שלך, אפשר לבחור Decline ולהמשיך. את ההגדרה אפשר לשנות בהמשך מתוך החשבון."]], "note": ["למה עוצרים כאן להסבר?", "זו בחירה נפרדת לגבי האפשרות להשאיל ניירות ערך מהחשבון. היא לא נדרשת לפתיחת החשבון, ולכן חשוב להבין מה היא אומרת לפני שבוחרים."]}, {"title": "Confirm Your Tax Residence , W-8BEN", "imgs": ["https://www.bankeronwheels.com/wp-content/uploads/2024/08/diciassette-1426x1536.png"], "items": [["1. Name of Beneficial Owner", "בדקי שהשם שלך נכון."], ["2. Country of Citizenship", "בדקי שהאזרחות נכונה."], ["3. Permanent Address", "בדקי שהכתובת נכונה."], ["4. Date of Birth", "בדקי שתאריך הלידה נכון."], ["5. US tax identification number (SSN or ITIN)", "אם אין לך SSN או ITIN אמריקאי, השאירי את השדה ריק." function finish(){fill.style.width="100%";user.style.right="100%";count.textContent="הבקשה נשלחה";let cs="";let colors=["#ed168c","#4fc3f7","#b59cff","#ffb536"];for(let n=0;n<18;n++){cs+=`<i class="confetti" style="left:${5+Math.random()*90}%;background:${colors[n%4]};animation-delay:${Math.random()*1.2}s"></i>`}main.innerHTML=`<div class="done"><div class="party">${cs}<div class="party-icon" aria-hidden="true">🎉</div></div><h1>הבקשה לפתיחת החשבון נשלחה</h1><p>סיימת את שלבי פתיחת החשבון והאימות. עכשיו הבקשה עוברת לבדיקה של IBKR.</p><div class="todo"><b>מה עושים עכשיו?</b><br><br><b>1. דו״ח שבועי:</b> עדכני בדו״ח השבועי המתגלגל: “שלחתי בקשה לפתיחת חשבון IBKR”.<br><b>2. מחכות לאישור:</b> IBKR מציינים שהבדיקה יכולה לקחת כמה ימים. אם הם מבקשים מסמך או מידע נוסף, השלימי אותו.<br><b>3. כשהחשבון מאושר:</b> הוסיפי לדו״ח: “החשבון אושר”.<br><b>4. IBKR Mobile:</b> התקיני את האפליקציה, התחברי אליה פעם אחת והשלימי IB Key / אימות דו-שלבי כדי שהגישה מהנייד תהיה מוכנה.<div class="security"><b>ושמרי את הסיסמה כמו שצריך:</b> במנהל סיסמאות. לא בצילום מסך, לא ב-Notes פתוח ולא בהודעה לעצמך.</div></div><div class="source">צילומי המסך במדריך מבוססים על walkthrough של Banker on Wheels, עודכן 12.5.2026. IBKR עשויים לשנות ניסוח, סדר או מסכים לפי מדינה ופרטי המשתמשת.</div></div>`}
intro();
</script></body></html>
