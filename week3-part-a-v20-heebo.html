 if(sub===2)c.innerHTML=`${qtitle('בדוח הופיע מסלול התקדמות גדול לצד השאלות. מה דעתך עליו?',3,total,'מסלול ההתקדמות')}${choices('track_effect',['עזר לי להבין איפה אני נמצאת וכמה נשאר','הפך את מילוי הדוח לקצת יותר נעים','אהבתי אותו ויזואלית, אבל הוא לא ממש השפיע על המילוי','כמעט לא שמתי לב אליו','הוא תפס מקום והייתי מעדיפה ממשק פשוט יותר'])}${required('u2err')}${actions("if(requireFields(['track_effect'],'u2err')) next()")}`;

 if(sub===0)c.innerHTML=`<p class="context"><b>מטרת הכלי</b> היתה להוציא את המשפט "הכסף עובד בשבילי" מהמקום הקלישאתי, להוריד אותו לקרקע ולעשות לו ויזואליזציה של ממש כדי להבין אותו כמו שצריך.</p>${refresh}${qtitle('האם התנסית בכלי?',1,total,'התנסות')}${choices('numbers_used',['כן','לא'])}${required('n0err')}${actions("if(requireFields(['numbers_used'],'n0err')) { if(data.numbers_used==='לא') move(4); else next(); }")}`;
 if(sub===1)c.innerHTML=`${qtitle('עם מה מצאת את עצמך משחקת?',2,total,'שימוש')}${choices('numbers_played',['הסכום החודשי','מספר השנים','אחוז התשואה','ניסיתי כל מיני שילובים','בעיקר הסתכלתי ולא ממש שיניתי'],true)}${required('n1err')}${actions("if(requireFields(['numbers_played'],'n1err')) next()")}`;
 if(sub===2)c.innerHTML=`${qtitle('עם איזה מספר מצאת את עצמך משחקת הכי הרבה?',3,total,'מוקד')}${choices('numbers_main',['הסכום החודשי','מספר השנים','אחוז התשואה','לא היה אחד במיוחד'])}${required('n2err')}${actions("if(requireFields(['numbers_main'],'n2err')) next()")}`;
 if(sub===3)c.innerHTML=`${qtitle('האם מצאת את עצמך משנה את המספרים כדי להגיע לתוצאה מסוימת?',4,total,'התנסות')}${choices('target_tried',['כן','לא'])}${required('n3err')}${actions("if(requireFields(['target_tried'],'n3err')) next()")}`;
 if(sub===4)c.innerHTML=`${qtitle('עד כמה האפשרות לשנות את המספרים בעצמך ולראות מיד את התוצאה עזרה לך לעומת ממשק סטטי שרק מציג את המידע?',5,total,'אינטראקטיביות')}${scale('interactive_value','לא היה משנה לי','האינטראקטיביות עשתה את ההבדל')}${required('n4err')}${actions("if(requireFields(['interactive_value'],'n4err')) next()")}`;
 if(sub===5)c.innerHTML=`${qtitle('כשהבנת שהנקודה שבה הכסף מתחיל לעבוד בשבילך יכולה להגיע רק אחרי הרבה זמן, איך זה הרגיש?',6,total,'זמן')}${choices('g_time_feeling',['זה דווקא חידד לי למה הזמן חשוב','זה הפתיע אותי, אבל לא ייאש אותי','זה קצת ייאש אותי','זה מאוד ייאש אותי','לא הרגשתי משהו מיוחד'])}${required('n5err')}${actions("if(requireFields(['g_time_feeling'],'n5err')) next()")}`;
 if(sub===6)c.innerHTML=`<p class="context"><b>נקודת ה-G</b> היא הסוויט ספוט שבה הרווחים שנצברו מתחילים להיות גדולים יותר מהכסף שהפקדת, כלומר נקודת ההיפוך שבה הכסף שלך מתחיל באמת לעבוד בשבילך.</p>${qtitle('האם הכלי הצליח להמחיש את זה? איך לדעתך ניתן להמחיש את זה טוב יותר?',7,total,'נקודת ה-G')}${field('g_point_feedback','אשמח לכל פידבק, הצעה לייעול או שיפור',data.g_point_feedback,'compact-field')}${required('n6err')}${actions("saveText('g_point_feedback'); if(requireText('g_point_feedback','n6err')) next()")}`;

function renderBudget(c){
 c.innerHTML=`<h1>תקציב להשקעה ראשונה</h1><div class="prompt first"><b>מה התקציב שהגדרת לעצמך?</b><input id="budget" class="field" placeholder="למשל 1,000 ₪" value="${data.budget||''}"></div><div class="prompt"><b>איך הגעת לסכום הזה?</b>${choices('budget_reason',['זה סכום שאני מרגישה בנוח להתחיל איתו','זה כסף שכבר היה לי פנוי','בחרתי סכום קטן כדי פשוט להתחיל','חישבתי כמה אני יכולה להרשות לעצמי להשקיע','התייעצתי עם מישהו'])}${field('budget_other','אחר',data.budget_other,'compact-field')}</div>${required('berr')}${actions("data.budget=q('#budget').value.trim(); saveText('budget_other'); if(data.budget && (data.budget_reason || data.budget_other)){q('#berr').textContent='';next()}else q('#berr').textContent='כדי להמשיך, מלאי את התקציב ובחרי תשובה או כתבי אחר.'")}`;
}
function renderIdeas(c){
 const n=sub+1;
 c.innerHTML=`${count()}<h1>רעיון ${n}</h1><div class="idea-block"><h2>רעיון ${n}</h2><label>רעיון להשקעה</label><input id="idea${n}" class="field" placeholder="כתבי את השם או הרעיון במילים שלך" value="${data['idea'+n]||''}"><label>איך קיבלת את הרעיון?</label><textarea id="idea${n}_source" class="field textarea small" placeholder="כתבי במילים שלך">${data['idea'+n+'_source']||''}</textarea><label>למה בחרת דווקא בזה? מה גרם לך לחשוב שהוא יכול להיות רעיון טוב להשקעה?</label><textarea id="idea${n}_why" class="field textarea" placeholder="ככל שתפרטי יותר זה יעזור לנו בשלב הבא">${data['idea'+n+'_why']||''}</textarea></div>${required('ierr')}${actions(`saveIdea(${n}); if(validateIdea(${n})) next()`)}`;
}
function q(s){return document.querySelector(s)}
function saveText(k){const e=q('#'+k);if(e)data[k]=e.value.trim()}
function saveMany(keys){keys.forEach(saveText)}
function saveIdea(n){['','_source','_why'].forEach(s=>{const k='idea'+n+s,e=q('#'+k);if(e)data[k]=e.value.trim()})}
function requireFields(keys,errId){const missing=keys.some(k=>!data[k] || (Array.isArray(data[k])&&!data[k].length));q('#'+errId).textContent=missing?'כדי להמשיך, עני על כל השאלות בעמוד.':'';return !missing}
function requireText(id,errId){const e=q('#'+id);if(e)data[id]=e.value.trim();if(!data[id]){q('#'+errId).textContent='כדי להמשיך, עני על כל השאלות בעמוד.';return false}return true}
function validateIdea(n){const ok=data['idea'+n]&&data['idea'+n+'_source']&&data['idea'+n+'_why'];q('#ierr').textContent=ok?'':'כדי להמשיך, מלאי את הרעיון, איך קיבלת אותו ולמה בחרת בו.';return ok}
function bind(){document.querySelectorAll('.choice,.scale-btn').forEach(b=>b.onclick=()=>{const k=b.dataset.name,v=b.dataset.val,m=b.dataset.multi==='true';if(m){data[k]=data[k]||[];const i=data[k].indexOf(v);i>=0?data[k].splice(i,1):data[k].push(v);b.classList.toggle('selected')}else{data[k]=v;document.querySelectorAll(`[data-name="${k}"]`).forEach(x=>x.classList.remove('selected'));b.classList.add('selected')}})}
function restoreSelections(){document.querySelectorAll('.choice,.scale-btn').forEach(b=>{const v=data[b.dataset.name];if(Array.isArray(v)?v.includes(b.dataset.val):String(v)===b.dataset.val)b.classList.add('selected')})}
async function submitReport(){
 const err=q('#submiterr');
 err.textContent='';
 const submissionId='R2-'+Date.now()+'-'+Math.random().toString(36).slice(2,8);
 const compactIdeas=[1,2,3].map(n=>`${n}. ${data['idea'+n]} | מקור: ${data['idea'+n+'_source']} | למה: ${data['idea'+n+'_why']}`).join('\n');
 const payload={
   report_type:'week3_part_a',
   ...data,
   name:'דוח שבועי #2',
   status:`קצב: ${data.pace} | פורמט: ${data.email_format} | בין משימות: ${data.between_tasks}`,
   platform:data.budget,
   considerations:[`חומרים: ${data.materials_read}`, ...(data.materials_value||[])],
   main_consideration:`פורמט הדוח: ${data.report_overall}/5 | תצוגה: ${data.display_feel}/5 | זמן: ${data.report_time} | אורך: ${data.report_length}`,
   blockers:[`מסלול: ${data.track_effect}`,`התקדמות: ${data.progress_preference}`],
   actual_time:data.report_time,
   almost_postponed:data.numbers_used,
   almost_why:`משחק: ${(data.numbers_played||[]).join(', ')} | עיקרי: ${data.numbers_main} | יעד: ${data.target_tried} | זמן ונקודת G: ${data.g_time_feeling||''}`,
   what_helped_continue:`אינטראקטיביות: ${data.interactive_value}/5 | נקודת G: ${data.g_point_feedback||''}`,
   unclear:`הכוונה נוספת: ${data.extra_guidance||''}`,
   guide_effect:data.general_feedback,
   feeling:compactIdeas,
   change_next:`תקציב: ${data.budget} | סיבה: ${data.budget_reason||data.budget_other}`,
   submission_id:submissionId
 };
 try{
   const body=new URLSearchParams({payload:JSON.stringify(payload)});
   await fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body});
   submitted=true;nav();
   q('#card').innerHTML=`<div class="success"><h1>הדוח נשלח ✓</h1><p>תודה. הדוח שלך נשלח למעבדה.</p><p class="tiny">מזהה שליחה: ${submissionId}</p></div>`;
 }catch(e){
   err.textContent='השליחה לא הצליחה. נסי שוב.';
 }
}

move(0);

</script>
